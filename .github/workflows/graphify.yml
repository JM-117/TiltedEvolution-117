name: Graphify

on:
  push:
    branches: [dev]
    paths-ignore: ['graphify-out/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install graphifyy
      # AST only, no LLM or API key needed
      - run: graphify update .
      - name: Commit refreshed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/GRAPH_REPORT.md
          git diff --cached --quiet || git commit -m "chore: refresh graphify graph [skip ci]" && git push
